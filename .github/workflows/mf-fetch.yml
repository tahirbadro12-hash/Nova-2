name: Fetch from MediaFire
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'download أو cleanup'
        required: true
        default: download
      mediafire_url:
        description: 'رابط الملف (لوضع download)'
        required: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download and split
        if: ${{ inputs.mode == 'download' }}
        run: |
          URL="${{ github.event.inputs.mediafire_url }}"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          curl -sL -c /tmp/cj -A "$UA" "$URL" -o page.html
          DL=$(grep -oE 'https://download[0-9]+\.mediafire\.com/[^"\\]+' page.html | head -1)
          [ -z "$DL" ] && { echo "no link"; exit 1; }
          curl -sL -b /tmp/cj -A "$UA" -H "Referer: $URL" -o src.zip "$DL"
          head -c 2 src.zip; echo "  <- PK = healthy zip"
          ls -la src.zip
          split -b 24M src.zip appsrc_part_
          ls -la appsrc_part_*
      - name: Commit parts to relay branch
        if: ${{ inputs.mode == 'download' }}
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git checkout -B relay/appsrc
          git add appsrc_part_*
          git commit -m "appsrc parts (MediaFire relay)"
          git push origin relay/appsrc
      - name: Cleanup
        if: ${{ inputs.mode == 'cleanup' }}
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git push origin --delete relay/appsrc
